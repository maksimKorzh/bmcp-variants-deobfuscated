/*******************************************\
  =========================================
            PIECE COLOR ENCOIDING
  =========================================
    
    White = 8 
    Black = 16

  =========================================
             PIECE TYPE ENCODING
  =========================================
  
    emSq,  P+, P-, K,  N,  B,  R,  Q
       0,  1,  2,  3,  4,  5,  6,  7
  
  =========================================
               PIECE ENCODING
  =========================================
  
   wP : P+ | w = 9     0001 | 1000 = 1001
   wK :  K | w = 11    0011 | 1000 = 1011
   wN :  N | w = 12    0100 | 1000 = 1100
   wB :  B | w = 13    0101 | 1000 = 1101
   wR :  R | w = 14    0110 | 1000 = 1110
   wQ :  Q | w = 15    0111 | 1000 = 1111
  
   bP : P- | b = 18   00010 | 10000 = 10010
   bK :  K | b = 19   00011 | 10000 = 10011
   bN :  N | b = 20   00100 | 10000 = 10100
   bB :  B | b = 21   00101 | 10000 = 10101
   bR :  R | b = 22   00110 | 10000 = 10110
   bQ :  Q | b = 23   00111 | 10000 = 10111

\*******************************************/

// 0x88 board + positional scores
var board = [
  22, 20, 21, 23, 19, 21, 20, 22,    0,  0,  5,  5,  0,  0,  5,  0, 
  18, 18, 18, 18, 18, 18, 18, 18,    5,  5,  0,  0,  0,  0,  5,  5,
   0,  0,  0,  0,  0,  0,  0,  0,    5, 10, 15, 20, 20, 15, 10,  5,
   0,  0,  0,  0,  0,  0,  0,  0,    5, 10, 20, 30, 30, 20, 10,  5,    
   0,  0,  0,  0,  0,  0,  0,  0,    5, 10, 20, 30, 30, 20, 10,  5,
   0,  0,  0,  0,  0,  0,  0,  0,    5, 10, 15, 20, 20, 15, 10,  5,
   9,  9,  9,  9,  9,  9,  9,  9,    5,  5,  0,  0,  0,  0,  5,  5,
  14, 12, 13, 15, 11, 13, 12, 14,    0,  0,  5,  5,  0,  0,  5,  0
];

// unicode characters to represent pieces on board
var pieces = [
  //           bP            bK        bN        bB        bR        bQ
  "", "", "\u265F",      "\u265A", "\u265E", "\u265D", "\u265C", "\u265B",
  
  //           wP            wK        wN        wB        wR        wQ 
  "",      "\u2659", "", "\u2654", "\u2658", "\u2657", "\u2656", "\u2655"

];

// Relative values to evaluate the material score of the position
var piece_weights = [
  //     bP       bK  bN    bB    bR    bQ
  0, 0, -100,     0, -300, -350, -500, -900,
  
  //     wP       wK  wN    wB    wR    wQ
  0,     100, 0,  0,  300,  350,  500,  900
];

// piece move offsets
var move_offsets = [

   15,  16,  17,   0,                           // black pawns
  -15, -16, -17,   0,                           // white pawns
    1,  16,  -1, -16,   0,                      // rooks
    1,  16,  -1, -16,  15, -15, 17, -17,  0,    // queens, kings and bishops
   14, -14,  18, -18,  31, -31, 33, -33,  0,    // knights
    3,  -1,  12,  21,  16,   7, 12              /* starting indexes for each piece type in order:
                                                   black pawns, white pawns, kings, knights, bishops, rooks, queens
                                                   
                                                   e.g. piece type is 4 - knight
                                                   move_offsets[30] == 0
                                                   move_offsets[from 31 to 37] == 3, -1, 12, 21, 16, 7, 12
                                                   so move_offsets[30 + type(which is 4 in case of knight)] is 34,
                                                   so at move_offset[34] value is 21 - this is the index where knight
                                                   offsets are starting, so we can loop over knight move offests to
                                                   generate knight moves.
                                                   
                                                */
];

// side to move
var sideToMove = 8;

// to store the best move found in search
var bestSourceSquare, bestTargetSquare;

// variable to check click-on-piece state
var click_lock = false;

// user input variables
var user_source, user_target;

// default search depth
var search_depth = 5;


/******************************\
 ==============================

          CHESS ENGINE

 ==============================
\******************************/

// search board position for the best move
function search(sideToMove, depth, alpha, beta) {
  // we are in the leaf node
  if (depth == 0) {
    // static evaluation score
    let score = 0;

    // loop over board squares
    for (var square = 0; square < 128; square++)
    {
      // make sure square is on board
      if ((square & 0x88) == 0)
      {
        // init piece
        let piece = board[square]
        
        // make sure square contains a piece
        if (piece)
        {
          // calculate material score
          score += piece_weights[piece & 15];
          
          // calculate positional score
          (piece & 8) ? (score += board[square + 8]) : (score -= board[square + 8]);
        }
      }
    }

    // return positive score for 8 and negative for black
    return (sideToMove == 8) ? score: -score;
  }

  var old_alpha = alpha;       // needed to check whether to store best move or not
  var temp_source;             // temorary best from square
  var temp_target;             // temporary best to square
  var score = -10000;          // minus infinity

  // move generator variables
  var piece, piece_type, directions, sourceSquare, targetSquare, capturedSquare, capturedPiece, stepVector;
  
  // loop over board squares
  for (var square = 0; square < 128; square++)
  {
    // make sure that square is on board
    if ((square & 0x88) == 0)
    {
      // init source square
      sourceSquare = square
    
      // init piece to move
      piece = board[square];
      
      // make sure piece belongs to the sideToMove to move
      if (piece & sideToMove)
      {
        // extract piece type
        piece_type = piece & 7;
        
        // init directions
        directions = move_offsets[piece_type + 30];
        
        // loop over piece move directions
        while(stepVector = move_offsets[++directions])    // loop over move offsets
        {
          // init target square
          targetSquare = sourceSquare;
          
          // loop over squares within a given move direction ray
          do
          {
            // init next target square within move direction ray
            targetSquare += stepVector;
            
            // init captured piece
            capturedSquare = targetSquare;
            
            // drop sliding if hit the edge of the board
            if(targetSquare & 0x88) break;
            
            // init captured piece
            capturedPiece = board[capturedSquare];
            
            // break if captured own piece
            if(capturedPiece & sideToMove) break;
            
            // pawns captures only diagonally
            if(piece_type < 3 && !(stepVector & 7) != !capturedPiece) break;
            
            // return mating score if king has been captured
            if((capturedPiece & 7) == 3) return 10000;
            
            // make move
            board[capturedSquare] = 0;       // clear captured square
            board[sourceSquare] = 0;         // clear source square (from square where piece was)
            board[targetSquare] = piece;     // put piece to destination square (to square)

            // pawn promotion
            if(piece_type < 3)    // if pawn
            {
                if(targetSquare + stepVector + 1 & 0x80)    // goes to the 1th/8th rank
                    board[targetSquare] |= 7;                // convert it to queen
            }

            // recursive negamax search call
            score = -search(24 - sideToMove, depth - 1, -beta, -alpha);    // recursive negamax search call

            // take back
            board[targetSquare] = 0;                   // clear the destination square (to square)
            board[sourceSquare] = piece;               // put the piece back to it's original square (from square)
            board[capturedSquare] = capturedPiece;    // restore captured piece on source square if any
            
            //Needed to detect checkmate
            bestSourceSquare = sourceSquare;
            bestTargetSquare = targetSquare;
            
            // PV node
            if(score > alpha)
            {
              // fail-high node
              if(score >= beta)
                return beta;    // beta cutoff
              
              // update alpha value
              alpha = score;

              // save best move in given branch
              temp_source = sourceSquare;
              temp_target = targetSquare;
            }        
            
            // fake capture for non-slider pieces
            capturedPiece += piece_type < 5;
            
            // unfake capture for pawns if double pawn push is on the cards
            if(piece_type < 3 & 6*sideToMove + (targetSquare & 0x70) == 0x80) capturedPiece--;
          }
          
          // condition to break out of loop over squares for non-slider pieces
          while(capturedPiece == 0)
        }
      }
    }
  }
  
  // store the best move
  if(alpha != old_alpha)
  {
      bestSourceSquare = temp_source;
      bestTargetSquare = temp_target;
  }

  // fail-low node
  return alpha;
}


/******************************\
 ==============================

           CHESS GUI

 ==============================
\******************************/

function make_move(sq) {
  // convert div ID to square index
  var click_sq = parseInt(sq, 10)
  
  // if user clicks on source square 
  if(!click_lock && board[click_sq]){
    // highlight clicked square
    document.getElementById(sq).style.backgroundColor = '#fff';
    
    // init user source square
    user_source = click_sq;
    
    // lock click
    click_lock ^= 1;
  }
  
  // if user clicks on destination square
  else if(click_lock){
    // extract row and column from target square
    var col = user_source & 7;
    var row = user_source >> 4;
    
    // restore color of the square that piece has left
    var color = (col + row) % 2 ? 'aaa' : 'eee'
    document.getElementById(user_source).style.backgroundColor = '#' + color;
    
    // move piece
    board[click_sq] = board[user_source];
    board[user_source] = 0;
    
    // if pawn promotion
    if(((board[click_sq] == 9) && (click_sq >= 0 && click_sq <= 7)) ||
       ((board[click_sq] == 18) && (click_sq >= 112 && click_sq <= 119)))
        board[click_sq] |= 7;    // convert pawn to corresponding sideToMove's queen
    
    // change sideToMove
    sideToMove = 24 - sideToMove;
    
    // unlock click
    click_lock ^= 1;
    
    // update position
    drawBoard();
    
    // make computer move in response
    setTimeout("think(search_depth)", 100);
  }
}

function think(depth){
  // search position
  var score = search(sideToMove, depth, -10000, 10000);
  
  // make AI move
  board[bestTargetSquare] = board[bestSourceSquare];
  board[bestSourceSquare] = 0;
  
  // if pawn promotion
  if(((board[bestTargetSquare] == 9) && (bestTargetSquare >= 0 && bestTargetSquare <= 7)) ||
     ((board[bestTargetSquare] == 18) && (bestTargetSquare >= 112 && bestTargetSquare <= 119)))
      board[bestTargetSquare] |= 7;    // convert pawn to corresponding sideToMove's queen
  
  // change sideToMove
  sideToMove = 24 - sideToMove;
  
  // Checkmate detection
  if(score == 10000){
    drawBoard();
    setTimeout(
      function(){
        alert("8 is checkmated!");
        location.reload();
      }, 100);
  }
  
  else if(score == -10000){
    setTimeout(
      function(){
        alert("Black is checkmated!");
        location.reload();
      }, 100);
  }
  
  else {
    drawBoard();
  }  
}

function drawBoard() {
  // clear previous board view
  try { document.getElementById('board').remove(); }
  catch (e) {/* nothing to remove when board wasn't initially rendered */}
  
  // create HTML rable tag
  var chess_board = '<table id="board" align="center" cellspacing="0" style="cursor: pointer;">';
  
  // loop over board rows
  for (var row = 0; row < 8; row++)
  {
    // create table row
    chess_board += '<tr>'
    
    // loop over board columns
    for (var col = 0; col < 16; col++)
    {
      // init square
      var square = row * 16 + col;
      
      // make sure square is on board
      if ((square & 0x88) == 0)
        // create table cell
        chess_board += '<td align="center" id="' + square + '"bgcolor="#' + ( ((col + row) % 2) ? 'aaa' : 'eee') + '" width="60" height="60" style="font-size: 50px;" onclick="make_move(this.id)">' + pieces[board[square] & 15] + '</td>';
    }
    
    // close table row tag
    chess_board += '</tr>';
  }
  
  // close div tag
  chess_board += '</table>';
  
  // render chess board to screen
  document.write(chess_board);
};

// initially render board view
drawBoard();

</script>
